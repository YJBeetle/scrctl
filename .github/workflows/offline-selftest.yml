# 构建并运行前端及 xdb 协议接入的无设备回归；设备后端在 xdb 仓库验证。
# 真机测试另外运行，避免 CI 依赖设备在线或占用同一设备的媒体会话。
# 测试项以 ctest -N 为准；未配置录制码流时，不注册需要该输入的测试。
name: offline-selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ctest:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            # 标准 macos-15 runner 是 ARM64；固定系统，避免 latest 升到 26
            # 后把主程序和 Homebrew bottles 的最低系统要求一起提升。
            os: macos-15
            # 下载精确版本的依赖源码；较大的 VCS/FFmpeg 依赖需要额外时间。
            timeout_minutes: 90
            build_jobs: 3
          - name: Ubuntu
            os: ubuntu-24.04
            timeout_minutes: 20
            build_jobs: 4
    # 两个平台都必须成功；构建、测试和可执行文件启动分别检查。
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: 装依赖（macOS）
        if: runner.os == 'macOS'
        # 前端依赖；设备服务由独立的 xdb Server 提供。
        run: brew install sdl2 ffmpeg pkg-config gettext

      - name: 装依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config gettext python3 libsdl2-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - name: 配置
        # 不指定 -G：默认生成器总归在，而 Ninja 是否预装是 runner 镜像的事。
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_nlohmann_json=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_CLI11=ON

      - name: 构建
        # Make 生成器下，无数值的 --parallel 会传入无上限的 -j。
        run: cmake --build build --parallel ${{ matrix.build_jobs }}

      # 链接成功不等于跑得起来：这一步只证明可执行文件在自己的平台上能起。
      # `--help` 在 SDL 初始化之前就到点了，所以无显示环境的 runner 也不需要屏幕。
      - name: 可执行文件冒烟
        run: ./build/scrctl --help >/dev/null

      - name: 离线自检
        run: ctest --test-dir build --output-on-failure

      - name: 打包工具离线回归
        run: |
          python3 -m unittest discover -s tests -p 'test_*sources.py' -v
          python3 -m unittest discover -s tests -p test_record_windows_package.py -v
          python3 -m unittest discover -s tests -p test_package_source_materials.py -v

      - name: Homebrew 源码收集离线回归
        if: runner.os == 'macOS'
        run: ruby tests/test_collect_macos_sources.rb

      - name: 安装 macOS 产物并记录实际依赖
        if: runner.os == 'macOS'
        run: |
          cmake --install build --prefix dist-macos
          python3 tools/record_macos_package.py dist-macos --source-commit "$GITHUB_SHA"
          ffmpeg -version > dist-macos/share/doc/scrctl/ffmpeg-build.txt
          git archive --format=tar HEAD > dist-macos/share/doc/scrctl/scrctl-source.tar

      - name: 收集 macOS 对应源码和构建材料
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_DEVELOPER=1 HOMEBREW_NO_AUTO_UPDATE=1 brew ruby tools/collect_macos_sources.rb dist-macos sources-macos/homebrew
          python3 tools/collect_embedded_sources.py build sources-macos/embedded
          python3 tools/package_source_materials.py dist-macos build sources-macos --platform macos

      - name: 上传 macOS 对应源码
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scrctl-sources-macos
          path: scrctl-sources-macos.tar
          compression-level: 0
          if-no-files-found: error

      - name: 检查搬移后的 macOS 安装包
        if: runner.os == 'macOS'
        run: python3 tools/test_macos_install.py dist-macos build

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ runner.os == 'macOS' && 'macos-test-logs' || 'linux-test-logs' }}
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore

      # tar 保留可执行权限和依赖符号链接，upload-artifact 的裸目录不会保留权限。
      - name: 归档 macOS 安装包
        if: runner.os == 'macOS'
        run: tar -czf "scrctl-macos-$(uname -m).tar.gz" -C dist-macos .

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scrctl-macos
          path: scrctl-macos-*.tar.gz

  windows:
    name: Windows ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: ARM64
            runner: windows-11-arm
            msystem: CLANGARM64
            package_prefix: mingw-w64-clang-aarch64
          - arch: x64
            label: x64
            runner: windows-2022
            msystem: CLANG64
            package_prefix: mingw-w64-clang-x86_64
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: 固定 Windows 源码换行
        shell: pwsh
        run: |
          # checkout uses Git for Windows; subsequent steps use MSYS2 Git.
          # Keep both implementations on the same LF worktree and local policy.
          git config --local core.autocrlf false
          git checkout-index --all --force
      - name: 安装 ${{ matrix.label }} 工具链和依赖
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            pacman-contrib
            ${{ matrix.package_prefix }}-clang
            ${{ matrix.package_prefix }}-cmake
            ${{ matrix.package_prefix }}-ninja
            ${{ matrix.package_prefix }}-gettext-tools
            ${{ matrix.package_prefix }}-SDL2
            ${{ matrix.package_prefix }}-python
            ${{ matrix.package_prefix }}-pkgconf
            ${{ matrix.package_prefix }}-ffmpeg
            ${{ matrix.package_prefix }}-nlohmann-json
      - name: 验证 MSYS2 源码签名通路
        run: |
          git diff --exit-code --stat HEAD
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.record_windows_package import MsysPackages
          from tools.collect_windows_sources import collect
          owner = '${{ matrix.package_prefix }}-bzip2'
          metadata = {'source_commit': os.environ['GITHUB_SHA'],
                      'msys2_packages': {owner: MsysPackages().metadata(owner)},
                      'runtime_dependencies': [{'msys2_package': owner}]}
          path = Path('source-signature-preflight.json')
          path.write_text(json.dumps(metadata), encoding='utf-8')
          collect(path, 'source-signature-preflight', jobs=1)
          PY
      - name: 打包工具离线回归
        run: |
          python -m unittest discover -s tests -p 'test_*sources.py' -v
          python -m unittest discover -s tests -p test_record_windows_package.py -v
          python -m unittest discover -s tests -p test_package_source_materials.py -v
      - name: 配置
        run: >-
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_nlohmann_json=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_CLI11=ON
      - name: 构建
        run: cmake --build build-win --parallel 4
      - name: 可执行文件启动
        run: ./build-win/scrctl.exe --help > /dev/null
      - name: 离线自检
        run: ctest --test-dir build-win --output-on-failure
      - name: 安装产物和依赖记录
        run: |
          cmake --install build-win --prefix dist-win
          mkdir -p dist-win/share/doc/scrctl/dependency-licenses
          cp -R "$MINGW_PREFIX/share/licenses/." dist-win/share/doc/scrctl/dependency-licenses/
          pacman -Q > dist-win/share/doc/scrctl/package-versions.txt
          ffmpeg -version > dist-win/share/doc/scrctl/ffmpeg-build.txt
          git rev-parse HEAD > dist-win/share/doc/scrctl/source-commit.txt
          git archive --format=tar HEAD > dist-win/share/doc/scrctl/scrctl-source.tar
          python tools/record_windows_package.py dist-win --runtime-directory "$MINGW_PREFIX/bin" --source-commit "$GITHUB_SHA"
      - name: 收集 Windows 对应源码和构建材料
        run: |
          python tools/collect_windows_sources.py dist-win/share/doc/scrctl/package-metadata.json sources-windows/msys2
          python tools/collect_embedded_sources.py build-win sources-windows/embedded
          python tools/package_source_materials.py dist-win build-win sources-windows --platform windows
      - name: 上传 Windows 对应源码
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scrctl-sources-windows-${{ matrix.arch }}
          path: scrctl-sources-windows.tar
          compression-level: 0
          if-no-files-found: error
      - name: 检查独立安装目录
        shell: pwsh
        run: ./tools/test_windows_install.ps1 -InstallDirectory dist-win -BuildDirectory build-win
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-${{ matrix.arch }}-test-logs
          path: build-win/Testing/Temporary/*.log
          if-no-files-found: ignore
      - name: 上传 Windows ${{ matrix.label }} 产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scrctl-windows-${{ matrix.arch }}
          path: dist-win/

  # 使用同一批离线用例检查字节缓冲访问、未对齐访问及其他未定义行为。
  sanitizer:
    name: ASan + UBSan
    runs-on: macos-latest
    # 最近一次完整作业耗时 19 分钟；为新增发现模块和依赖下载保留构建余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: 装依赖
        run: brew install sdl2 ffmpeg pkg-config gettext

      - name: 配置（Debug + 两个 sanitizer）
        run: >
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"

      - name: 构建
        run: cmake --build build-san --parallel 3

      - name: 离线自检
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

      - name: 上传 sanitizer 测试日志
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sanitizer-test-logs
          path: build-san/Testing/Temporary/*.log
          if-no-files-found: ignore
