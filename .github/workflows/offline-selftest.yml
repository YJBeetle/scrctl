# 构建并运行不需要设备的回归测试：协议编解码、lwIP 传输、媒体状态和命令行。
# 真机测试另外运行，避免 CI 依赖设备在线或占用同一设备的媒体会话。
# 测试项以 ctest -N 为准；未配置录制码流时，不注册需要该输入的测试。
name: offline-selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ctest:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            # 标准 macos-15 runner 是 ARM64；固定系统，避免 latest 升到 26
            # 后把主程序和 Homebrew bottles 的最低系统要求一起提升。
            os: macos-15
          - name: Ubuntu
            os: ubuntu-latest
    # 两个平台都必须成功；构建、测试和可执行文件启动分别检查。
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖（macOS）
        if: runner.os == 'macOS'
        # 与 README 里那行一致。openssl 是 keg-only，配置时要显式给前缀（下一步）。
        run: brew install sdl2 openssl ffmpeg pkg-config gettext

      - name: 装依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config gettext python3 libsdl2-dev libssl-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - name: 配置
        # 不指定 -G：默认生成器总归在，而 Ninja 是否预装是 runner 镜像的事。
        run: |
          EXTRA=""
          if [ "$(uname)" = "Darwin" ]; then
            EXTRA="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl)"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: 构建
        run: cmake --build build --parallel

      # 链接成功不等于跑得起来：这一步只证明可执行文件在自己的平台上能起。
      # `--help` 在 SDL 初始化之前就到点了，所以无显示环境的 runner 也不需要屏幕。
      - name: 可执行文件冒烟
        run: ./build/scrctl --help >/dev/null

      - name: 离线自检
        run: ctest --test-dir build --output-on-failure

      - name: 安装 macOS 产物并记录实际依赖
        if: runner.os == 'macOS'
        run: |
          cmake --install build --prefix dist-macos
          python3 tools/record_macos_package.py dist-macos --source-commit "$GITHUB_SHA"
          ffmpeg -version > dist-macos/share/doc/scrctl/ffmpeg-build.txt
          git archive --format=tar HEAD > dist-macos/share/doc/scrctl/scrctl-source.tar

      - name: 检查搬移后的 macOS 安装包
        if: runner.os == 'macOS'
        run: python3 tools/test_macos_install.py dist-macos build

      - name: 上传 macOS 测试日志
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore

      # tar 保留可执行权限和依赖符号链接，upload-artifact 的裸目录不会保留权限。
      - name: 归档 macOS 安装包
        if: runner.os == 'macOS'
        run: tar -czf "scrctl-macos-$(uname -m).tar.gz" -C dist-macos .

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: scrctl-macos
          path: scrctl-macos-*.tar.gz

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ARM64 工具链和依赖
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-openssl
            mingw-w64-clang-aarch64-gettext-tools
            mingw-w64-clang-aarch64-SDL2
            mingw-w64-clang-aarch64-python
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-ffmpeg
            mingw-w64-clang-aarch64-nlohmann-json
            mingw-w64-clang-aarch64-pugixml
      - name: 配置
        run: >-
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: 构建
        run: cmake --build build-win --parallel 4
      - name: 可执行文件启动
        run: ./build-win/scrctl.exe --help > /dev/null
      - name: 离线自检
        run: ctest --test-dir build-win --output-on-failure
      - name: 安装产物和依赖记录
        run: |
          cmake --install build-win --prefix dist-win
          mkdir -p dist-win/share/doc/scrctl/dependency-licenses
          cp -R "$MINGW_PREFIX/share/licenses/." dist-win/share/doc/scrctl/dependency-licenses/
          pacman -Q > dist-win/share/doc/scrctl/package-versions.txt
          ffmpeg -version > dist-win/share/doc/scrctl/ffmpeg-build.txt
          git rev-parse HEAD > dist-win/share/doc/scrctl/source-commit.txt
          git archive --format=tar HEAD > dist-win/share/doc/scrctl/scrctl-source.tar
      - name: 检查独立安装目录
        shell: pwsh
        run: ./tools/test_windows_install.ps1 -InstallDirectory dist-win -BuildDirectory build-win
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-test-logs
          path: build-win/Testing/Temporary/*.log
          if-no-files-found: ignore
      - name: 上传 Windows ARM64 产物
        uses: actions/upload-artifact@v4
        with:
          name: scrctl-windows-arm64
          path: dist-win/

  # 使用同一批离线用例检查字节缓冲访问、未对齐访问及其他未定义行为。
  sanitizer:
    name: ASan + UBSan
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: brew install sdl2 openssl ffmpeg pkg-config gettext

      - name: 配置（Debug + 两个 sanitizer）
        run: >
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"

      - name: 构建
        run: cmake --build build-san --parallel

      - name: 离线自检
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure
