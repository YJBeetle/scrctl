# 构建并运行不需要设备的回归测试：协议编解码、lwIP 传输、媒体状态和命令行。
# 真机测试另外运行，避免 CI 依赖设备在线或占用同一设备的媒体会话。
# 测试项以 ctest -N 为准；未配置录制码流时，不注册需要该输入的测试。
name: offline-selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ctest:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Ubuntu
            os: ubuntu-latest
    # 两个平台都必须成功；构建、测试和可执行文件启动分别检查。
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖（macOS）
        if: runner.os == 'macOS'
        # 与 README 里那行一致。openssl 是 keg-only，配置时要显式给前缀（下一步）。
        run: brew install sdl2 openssl ffmpeg pkg-config gettext

      - name: 装依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config gettext python3 libsdl2-dev libssl-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - name: 配置
        # 不指定 -G：默认生成器总归在，而 Ninja 是否预装是 runner 镜像的事。
        run: |
          EXTRA=""
          if [ "$(uname)" = "Darwin" ]; then
            EXTRA="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl)"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: 构建
        run: cmake --build build --parallel

      # 链接成功不等于跑得起来：这一步只证明可执行文件在自己的平台上能起。
      # `--help` 在 SDL 初始化之前就到点了，所以无显示环境的 runner 也不需要屏幕。
      - name: 可执行文件冒烟
        run: ./build/scrctl --help >/dev/null

      - name: 离线自检
        run: ctest --test-dir build --output-on-failure

  # 同一批用例在 ASan + UBSan 下再跑一遍。为什么值得单开一格：这仓库里全是手工
  # 拼的字节缓冲（UDP 头、RTP 分片、XPC 序列化），越界与未对齐正是这类代码的默认
  #  bug 形状，而这批用例不需要真机。
  sanitizer:
    name: ASan + UBSan
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: brew install sdl2 openssl ffmpeg pkg-config gettext

      - name: 配置（Debug + 两个 sanitizer）
        run: >
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"

      - name: 构建
        run: cmake --build build-san --parallel

      - name: 离线自检
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure
